name: Build Téra Tools

# Compila o plugin a cada push e disponibiliza um .zip pronto para instalar
# (aba "Actions" do GitHub > execução mais recente > "Artifacts").

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes automáticos do núcleo
        run: dotnet test tests/TeraTools.Core.Tests/TeraTools.Core.Tests.csproj -c Release

      - name: Compilar add-in (Release)
        run: dotnet build src/TeraTools.Revit/TeraTools.Revit.csproj -c Release

      - name: Publicar pacote para instalação
        uses: actions/upload-artifact@v4
        with:
          name: TeraTools-Revit2027
          path: dist/TeraTools-Revit2027/

      - name: Compactar para release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/TeraTools-Revit2027/* -DestinationPath TeraTools-Revit2027.zip

      - name: Criar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TeraTools-Revit2027.zip
